name: Build Android APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package DailyTrade APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/DailyTrade.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyTrade-APK
          path: release-output/DailyTrade.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/DailyTrade.apk
          name: DailyTrade ${{ github.ref_name }}
          body: |
            ## 🚀 DailyTrade Release ${{ github.ref_name }}
            
            100% Free Paper Trading Simulator with Real Live Market Feeds.
            
            ### 📱 Download & Install:
            - **Android APK**: Download [`DailyTrade.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/DailyTrade.apk) directly to your Android device.
            
            ### 💡 Highlights:
            - 120+ Live Symbols (Crypto, Stocks, Oil, Forex, ETFs, Fixed Income)
            - 100% Zero-CORS Live Market Streaming
            - Local Offline-First Storage (No sign-up required)
            
            ---
            *Developer: Luxie47 (luxie47@gmail.com | Discord: Luxie47)*  
            *Check out our flagship productivity app: [DailyFlow](https://dailyflow-luxie.vercel.app)*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
